name: CI

# Railway auto-deploys `staging` and `main` on push, so this runs on the same pushes (and on PRs)
# to catch a broken typecheck/test/build before or as it lands. Make it a required check in
# branch protection to actually block merges.

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment), in keeping with the
      # repo's supply-chain posture (see minimumReleaseAge in pnpm-workspace.yaml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm --filter @workspace/api-server run test

      - name: Build
        run: pnpm -r --if-present run build
        env:
          PORT: "3000"
          BASE_PATH: /
          VITE_SITE_URL: https://ci.invalid

      - name: Generated API code is up to date with openapi.yaml
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-zod lib/api-client-react \
            || { echo "::error::Run 'pnpm --filter @workspace/api-spec run codegen' and commit the result"; exit 1; }

      - name: Audit (fail on critical)
        run: pnpm audit --audit-level critical
